<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Xcitways Game</title>
  <style>
    body {
      background-color: #181d2c;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      font-family: sans-serif;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(3, 120px);
      grid-template-rows: repeat(3, 120px);
      gap: 4px;
    }

    .cell {
      position: relative;
      background-color: black;
      border: 2px solid #888;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
    }

    .corner {
      background: linear-gradient(to right, var(--color1) 50%, var(--color2) 50%);
    }

    .quartered::before,
    .quartered::after {
      content: "";
      position: absolute;
      background-color: gray;
    }

    .quartered::before {
      width: 2px;
      height: 100%;
      left: 50%;
    }

    .quartered::after {
      height: 2px;
      width: 100%;
      top: 50%;
    }

    .piece {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      margin: 4px;
      cursor: pointer;
      border: 2px solid white;
    }

    .highlight {
      outline: 2px dashed yellow;
    }
  </style>
</head>
<body>
  <div class="board" id="gameBoard">
    <!-- Cells will be generated by JavaScript -->
  </div>

  <script>
    const board = document.getElementById('gameBoard');
    const pieceColors = {
      'red': 'red',
      'orange': 'orange',
      'yellow': 'gold',
      'green': 'forestgreen',
      'white': 'white',
      'lavender': 'lavender',
      'darkblue': 'darkblue',
      'lightblue': 'lightblue'
    };

    const cellTypes = [
      {type: 'corner', colors: ['red', 'orange']},
      {type: 'quartered', id: 'top-middle'},
      {type: 'corner', colors: ['yellow', 'green']},

      {type: 'quartered', id: 'middle-left'},
      {type: 'center'},
      {type: 'quartered', id: 'middle-right'},

      {type: 'corner', colors: ['white', 'lavender']},
      {type: 'quartered', id: 'bottom-middle'},
      {type: 'corner', colors: ['darkblue', 'lightblue']}
    ];

    const pieces = {
      'top-middle': ['darkblue', 'darkblue', 'lavender', 'lavender'],
      'middle-left': ['lightblue', 'lightblue', 'green', 'green'],
      'middle-right': ['white', 'white', 'orange', 'orange'],
      'bottom-middle': ['yellow', 'yellow', 'red', 'red']
    };

    function generateBoard() {
      cellTypes.forEach((cell, index) => {
        const div = document.createElement('div');
        div.classList.add('cell');

        if (cell.type === 'corner') {
          div.classList.add('corner');
          div.style.setProperty('--color1', pieceColors[cell.colors[0]]);
          div.style.setProperty('--color2', pieceColors[cell.colors[1]]);
        }

        if (cell.type === 'quartered') {
          div.classList.add('quartered');
          if (pieces[cell.id]) {
            pieces[cell.id].forEach((color, i) => {
              const piece = document.createElement('div');
              piece.classList.add('piece');
              piece.style.backgroundColor = pieceColors[color];
              piece.dataset.color = color;
              piece.dataset.position = cell.id + '-' + i;
              piece.addEventListener('click', () => {
                console.log(`Clicked ${color} piece in ${cell.id}`);
              });
              div.appendChild(piece);
            });
          }
        }

        board.appendChild(div);
      });
    }

    generateBoard();
  </script>
</body>
</html>
