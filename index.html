
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Xcitways</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background-color: #181d2c;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      width: 90vmin;
      height: 90vmin;
      gap: 3px;
      background-color: #181d2c;
    }

    .cell {
      position: relative;
      background-color: black;
      border: 2px solid #888;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
    }

    .corner {
      background: linear-gradient(to right, var(--color1, red) 50%, var(--color2, orange) 50%);
    }

    .quartered::before,
    .quartered::after {
      content: "";
      position: absolute;
      background-color: gray;
    }

    .quartered::before {
      width: 2px;
      height: 100%;
      left: 50%;
    }

    .quartered::after {
      height: 2px;
      width: 100%;
      top: 50%;
    }

    .piece {
      width: 20%;
      aspect-ratio: 1;
      border-radius: 50%;
      margin: 4%;
      border: 2px solid white;
      box-sizing: border-box;
    }
  </style>
</head>
<body>
  <div class="board" id="gameBoard">
    <div class="cell corner" style="--color1: red; --color2: orange;"></div>
    <div class="cell quartered">
      <div class="piece" style="background-color: darkblue;"></div>
      <div class="piece" style="background-color: darkblue;"></div>
      <div class="piece" style="background-color: lavender;"></div>
      <div class="piece" style="background-color: lavender;"></div>
    </div>
    <div class="cell corner" style="--color1: gold; --color2: darkgreen;"></div>

    <div class="cell quartered">
      <div class="piece" style="background-color: lightblue;"></div>
      <div class="piece" style="background-color: lightblue;"></div>
      <div class="piece" style="background-color: forestgreen;"></div>
      <div class="piece" style="background-color: forestgreen;"></div>
    </div>
    <div class="cell"></div>
    <div class="cell quartered">
      <div class="piece" style="background-color: white;"></div>
      <div class="piece" style="background-color: white;"></div>
      <div class="piece" style="background-color: orange;"></div>
      <div class="piece" style="background-color: orange;"></div>
    </div>

    <div class="cell corner" style="--color1: ivory; --color2: lavender;"></div>
    <div class="cell quartered">
      <div class="piece" style="background-color: gold;"></div>
      <div class="piece" style="background-color: gold;"></div>
      <div class="piece" style="background-color: red;"></div>
      <div class="piece" style="background-color: red;"></div>
    </div>
    <div class="cell corner" style="--color1: darkblue; --color2: lightblue;"></div>
  </div>
</body>
</html>
